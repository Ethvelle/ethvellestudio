name: Build Ethvelle Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Assemble the v365 editor HTML
        shell: bash
        run: |
          mkdir -p android-apk/app/src/main/assets
          cat android-apk/source-parts/part-*.txt > android-apk/app/src/main/assets/index.html
          test "$(wc -c < android-apk/app/src/main/assets/index.html)" -gt 9000000
          grep -q "__ethvelleNativePickerResolve" android-apk/app/src/main/assets/index.html

      - name: Build debug APK
        run: gradle --no-daemon -p android-apk assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Ethvelle-Android-APK
          path: android-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
