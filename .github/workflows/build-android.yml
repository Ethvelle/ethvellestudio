name: Build Ethvelle Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Rebuild the current v365 HTML asset
        shell: bash
        run: |
          mkdir -p android/app/src/main/assets
          shopt -s nullglob
          source_parts=(android-source-v365/part-*.txt)
          test "${#source_parts[@]}" -eq 102
          output="android/app/src/main/assets/index.html"
          : > "$output"
          for part in "${source_parts[@]}"; do
            case "$part" in
              *part-063001-*.txt) cat "$part" >> "$output" ;;
              *part-070001.txt) cat "$part" >> "$output" ;;
              *) cat "$part" >> "$output"; printf '\n' >> "$output" ;;
            esac
          done
          test -s "$output"
          echo "Bundled HTML bytes: $(wc -c < "$output")"
          grep -q 'ethvelle-android-native-media-bridge' "$output"
          grep -q '</html>' "$output"

      - name: Build debug APK
        run: gradle --no-daemon -p android assembleDebug

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ethvelle-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
