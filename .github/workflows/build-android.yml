name: Build Ethvelle Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Assemble v439 HTML for the WebView
        shell: bash
        run: |
          mkdir -p android/app/src/main/assets
          shopt -s nullglob
          source_parts=(android-source-v439/part-*.txt)
          test "${#source_parts[@]}" -eq 16
          output="android/app/src/main/assets/index.html"
          : > "$output"
          for part in "${source_parts[@]}"; do
            cat "$part" >> "$output"
            printf '\n' >> "$output"
          done
          python3 - <<'PY'
          from pathlib import Path
          html_path = Path("android/app/src/main/assets/index.html")
          html = html_path.read_text(encoding="utf-8")
          if not html.lstrip().startswith("<!DOCTYPE html>"):
              raise SystemExit("The bundled editor HTML has an invalid beginning.")
          if not html.rstrip().lower().endswith("</html>"):
              raise SystemExit("The bundled editor HTML is incomplete.")
          if 'id="ethvelle-v439-cloud-media"' not in html:
              raise SystemExit("The expected v439 Cloud Media source was not found.")
          print(f"Bundled v439 HTML: {html_path.stat().st_size:,} bytes")
          PY
          test -s "$output"

      - name: Build debug APK
        run: gradle --no-daemon -p android assembleDebug

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ethvelle-Android-APK-v439
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
