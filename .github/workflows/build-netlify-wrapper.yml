name: Build Ethvelle studio Netlify-wrapper APK

on:
  push:
    branches: [main]
    paths:
      - "netlify-wrapper/**"
      - ".github/workflows/build-netlify-wrapper.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Capacitor and create Android project
        working-directory: netlify-wrapper
        run: |
          npm install --no-audit --no-fund
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Use the fixed debug signing key
        run: |
          mkdir -p "$HOME/.android"
          cp netlify-wrapper/ci/debug.keystore "$HOME/.android/debug.keystore"

      - name: Create Ethvelle studio launcher icon
        shell: bash
        run: |
          set -euo pipefail
          ICON_URL="https://i.ibb.co.com/1Y308tCj/Picsart-26-11-18-20-36-10-772.png"
          curl -fL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 90 "$ICON_URL" -o /tmp/ethvelle-studio-icon.png
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import re
          root = Path("netlify-wrapper/android/app/src/main/res")
          source = Image.open("/tmp/ethvelle-studio-icon.png").convert("RGBA")
          if source.width < 64 or source.height < 64:
              raise SystemExit("The supplied launcher image is unexpectedly small.")
          for folder, size in {"mipmap-mdpi":48,"mipmap-hdpi":72,"mipmap-xhdpi":96,
                               "mipmap-xxhdpi":144,"mipmap-xxxhdpi":192}.items():
              dest = root / folder
              dest.mkdir(parents=True, exist_ok=True)
              fitted = ImageOps.contain(source, (size,size), Image.Resampling.LANCZOS)
              canvas = Image.new("RGBA", (size,size), (15,15,18,255))
              canvas.alpha_composite(fitted, ((size-fitted.width)//2,(size-fitted.height)//2))
              canvas.save(dest/"ic_launcher.png", optimize=True)
              canvas.save(dest/"ic_launcher_round.png", optimize=True)
          foreground = Image.new("RGBA",(432,432),(0,0,0,0))
          fitted = ImageOps.contain(source,(288,288),Image.Resampling.LANCZOS)
          foreground.alpha_composite(fitted,((432-fitted.width)//2,(432-fitted.height)//2))
          d = root/"drawable-nodpi"; d.mkdir(parents=True,exist_ok=True)
          foreground.save(d/"ic_launcher_foreground.png", optimize=True)
          anydpi = root/"mipmap-anydpi-v26"; anydpi.mkdir(parents=True,exist_ok=True)
          values = root/"values"; values.mkdir(parents=True,exist_ok=True)
          (values/"launcher_colors.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="ethvelle_launcher_background">#0F0F12</color></resources>\n',
              encoding="utf-8")
          adaptive = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ethvelle_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          '''
          (anydpi/"ic_launcher.xml").write_text(adaptive,encoding="utf-8")
          (anydpi/"ic_launcher_round.xml").write_text(adaptive,encoding="utf-8")
          strings = values/"strings.xml"
          if strings.exists():
              xml = strings.read_text(encoding="utf-8")
              xml, count = re.subn(r'<string name="app_name">.*?</string>',
                                   '<string name="app_name">Ethvelle studio</string>',
                                   xml, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit("Could not set the Android app label.")
              strings.write_text(xml,encoding="utf-8")
          print(f"Launcher icon generated from transparent PNG ({source.width}x{source.height}).")
          PY

      - name: Build installable Android APK
        working-directory: netlify-wrapper/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p netlify-wrapper/dist
          cp netlify-wrapper/android/app/build/outputs/apk/debug/app-debug.apk netlify-wrapper/dist/Ethvelle-studio.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ethvelle-studio-Netlify-APK
          path: netlify-wrapper/dist/Ethvelle-studio.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ethvelle-netlify-apk-latest
          name: Ethvelle studio — Netlify wrapper APK
          body: |
            Android wrapper for the live website https://ethvelle.netlify.app
            App name: Ethvelle studio
            Package: app.ethvelle.editor
            Debug APK for direct Android installation/testing; not Play Store signed.
          files: netlify-wrapper/dist/Ethvelle-studio.apk
          overwrite_files: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
